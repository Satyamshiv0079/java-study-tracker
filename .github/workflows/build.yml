name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build React Frontend
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'backend/pom.xml'
      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw
      - name: Build and Test Java Spring Boot Backend
        run: cd backend && ./mvnw clean verify

  test-python-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-rag/requirements.txt'
      - name: Install dependencies
        run: |
          cd python-rag
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          cd python-rag
          pytest tests/

