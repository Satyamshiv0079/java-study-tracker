# Test Configuration for CodeMentor JUnit/Integration Tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: SuperSecureTestSecretKeyForUnitAndIntegrationTestsOnlyAtLeast32Bytes!

rate-limiter:
  trust-proxy-headers: false

rag:
  service:
    url: http://localhost:8000
    token: test-internal-token-for-pytest
